<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <div class="container" style="margin-top: 40px;">
    <div style="max-width: 400px; margin: 0 auto;">
      <h1 style="text-align: center;">LeaveEasy</h1>
      <p style="text-align: center; color: #667380;">เข้าสู่ระบบขอลาออนไลน์</p>

      <div class="card">
        <!-- ข้อความแจ้งเตือน -->
        <div id="login-error" class="alert alert-error hidden"></div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form id="login-form">
          <label for="email">อีเมล</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="user@example.com"
            required
            autofocus
          >

          <label for="password">รหัสผ่าน</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="กรอกรหัสผ่าน"
            required
          >

          <div class="btn-row">
            <button type="submit" id="login-submit-btn">เข้าสู่ระบบ</button>
          </div>
        </form>

        <!-- ลิงค์ไปหน้าสมัครสมาชิก -->
        <p style="text-align: center; margin-top: 18px; color: #667380;">
          ยังไม่มีบัญชี?
          <a href="register.html" style="color: #1f5f8b; text-decoration: none; font-weight: 600;">สมัครสมาชิก</a>
        </p>
      </div>

      <!-- ลิงค์กลับหน้าแรก -->
      <div style="text-align: center; margin-top: 18px;">
        <a href="index.html" style="color: #1f5f8b; text-decoration: none; font-size: 15px;">← กลับหน้าแรก</a>
      </div>
    </div>
  </div>
</body>
</html>
