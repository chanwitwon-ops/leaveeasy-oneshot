<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการใบลา · LeaveEasy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/leave-requests.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>รายการใบลา</h1>
    <p class="subtitle">ใบขอลาทั้งหมดในระบบ กดที่แถวเพื่อดูรายละเอียด</p>

    <div class="btn-row">
      <a class="btn" href="new-leave-request.html">+ ยื่นใบลาใหม่</a>
    </div>

    <!-- ตารางใบลา -->
    <div id="leave-requests-container" class="card" style="margin-top:16px">
      <table id="leave-requests-table">
        <thead>
          <tr>
            <th>หัวข้อ</th>
            <th>ประเภทการลา</th>
            <th>สถานะ</th>
            <th>ผู้ขอลา</th>
            <th>วันที่ลา</th>
          </tr>
        </thead>
        <tbody id="leave-requests-list">
          <!-- แถวใบลาจะถูกเพิ่มที่นี่ด้วย JS -->
        </tbody>
      </table>

      <!-- ข้อความเมื่อไม่มีใบลา -->
      <div id="empty-state" class="hidden" style="padding: 30px; text-align: center;">
        <p style="color: #667380; font-size: 18px;">ยังไม่มีใบขอลาในระบบ</p>
      </div>
    </div>
  </div>
</body>
</html>
