<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/leave-request-detail.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>รายละเอียดใบลา</h1>

    <!-- กล่องข้อมูลใบลา -->
    <div id="detail-container" class="card">
      <p>กำลังโหลดข้อมูล…</p>
    </div>

    <!-- ปุ่มการกระทำ (อนุมัติ/ไม่อนุมัติ/ลบ) - จะแสดงตามสถานะและบทบาท -->
    <div id="action-buttons" class="card hidden">
      <div class="btn-row">
        <!-- ปุ่มอนุมัติ - สำหรับผู้อนุมัติ เมื่อสถานะเป็น รอพิจารณา -->
        <button type="button" id="approve-btn" class="btn btn-ok hidden" data-status-required="รอพิจารณา">
          ✓ อนุมัติ
        </button>

        <!-- ปุ่มไม่อนุมัติ - สำหรับผู้อนุมัติ เมื่อสถานะเป็น รอพิจารณา -->
        <button type="button" id="reject-btn" class="btn btn-danger hidden" data-status-required="รอพิจารณา">
          ✗ ไม่อนุมัติ
        </button>

        <!-- ปุ่มลบ - สำหรับผู้ขอลา เมื่อสถานะเป็น รอพิจารณา -->
        <button type="button" id="delete-btn" class="btn btn-danger hidden" data-status-required="รอพิจารณา">
          🗑 ลบใบลา
        </button>
      </div>
    </div>

    <!-- กล่องความเห็นการอนุมัติ -->
    <div id="comments-section" class="card hidden">
      <h2>ความเห็นการอนุมัติ</h2>

      <!-- รายการความเห็น -->
      <div id="comments-list">
        <!-- ความเห็นแต่ละรายการจะถูกเพิ่มที่นี่ด้วย JS -->
      </div>

      <!-- ข้อความเมื่อยังไม่มีความเห็น -->
      <div id="empty-comments" style="padding: 20px; text-align: center; color: #667380;">
        <p>ยังไม่มีความเห็นในใบลานี้</p>
      </div>

      <hr style="margin: 18px 0; border: none; border-top: 1px dashed #d8dee4;">

      <!-- ฟอร์มเขียนความเห็นใหม่ -->
      <label for="comment-input">เขียนความเห็นใหม่</label>
      <textarea id="comment-input" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
      <div id="comment-error" class="alert alert-error hidden"></div>
      <div class="btn-row">
        <button type="button" id="submit-comment-btn">ส่งความเห็น</button>
      </div>
    </div>

    <!-- ปุ่มกลับหน้ารายการ -->
    <div class="btn-row">
      <a class="btn btn-ghost" href="leave-requests.html">← กลับไปหน้ารายการ</a>
    </div>
  </div>
</body>
</html>
