<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยื่นใบลาใหม่ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <!-- js/ai-config.js มีคีย์ OpenRouter จริง ต้องสร้างเองจาก js/ai-config.example.js (ดู README) -->
  <script src="js/ai-config.js" defer></script>
  <script src="js/new-leave-request.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>ยื่นใบลาใหม่</h1>
    <p class="subtitle">กรอกให้ครบทุกช่อง แล้วกดบันทึก · ใบลาใหม่จะมีสถานะ รอพิจารณา เสมอ</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มใบลา">
        <label for="title">หัวข้อ</label>
        <input type="text" id="title" placeholder="เช่น ลาพักร้อนไปเที่ยวกับครอบครัว">

        <label for="reason">เหตุผลการลา</label>
        <textarea id="reason" placeholder="เล่าเหตุผลสั้น ๆ ให้หัวหน้าเข้าใจ"></textarea>

        <label for="leaveTypeId">ประเภทการลา</label>
        <select id="leaveTypeId">
          <option value="">— เลือกประเภทการลา —</option>
        </select>

        <label for="startDate">วันที่เริ่มลา</label>
        <input type="date" id="startDate">

        <label for="endDate">วันที่สิ้นสุด</label>
        <input type="date" id="endDate">

        <!-- US-09: ปุ่มให้ AI ช่วยจัดประเภทการลา -->
        <div id="ai-classifier-area" style="margin-top: 18px;">
          <button type="button" id="ai-classify-btn" class="btn">ให้ AI ช่วยจัดประเภทการลา</button>

          <div id="ai-suggestion-box" class="alert alert-ai hidden" style="margin-top: 12px;">
            <p id="ai-suggestion-label" class="hidden" style="margin: 0 0 8px; font-size: 15px;">
              💡 <strong>ข้อเสนอจาก AI — โปรดตรวจสอบก่อนยืนยัน</strong>
            </p>
            <p id="ai-suggestion-text" style="margin: 0; font-size: 15px;"></p>
            <button type="button" id="ai-accept-btn" class="btn hidden" style="margin-top: 8px;">ตกลงใช้ข้อเสนอนี้</button>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" id="submit-btn">บันทึก</button>
          <a class="btn btn-ghost" href="leave-requests.html">ยกเลิก</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
